<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="piece" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="75%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <!-- Nền vuông bo góc chuẩn App -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Kẻ bàn cờ mờ phía sau -->
  <g stroke="#d97706" stroke-width="5" opacity="0.25">
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="64" y1="64" x2="448" y2="448"/>
    <line x1="448" y1="64" x2="64" y2="448"/>
    <rect x="64" y="64" width="384" height="384" fill="none" stroke-width="8"/>
  </g>
  
  <!-- Quân cờ nổi 3D -->
  <circle cx="256" cy="256" r="205" fill="url(#piece)" stroke="#92400e" stroke-width="14" filter="url(#shadow)"/>
  
  <!-- Vòng tròn đứt đoạn -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#b91c1c" stroke-width="6" stroke-dasharray="16,10"/>
  
  <!-- Chữ Tướng (Soái) Đỏ dịch xuống thêm -->
  <text x="256" y="236" font-family="'KaiTi', 'STKaiti', 'PMingLiU', 'Noto Serif SC', serif" font-size="150" font-weight="900" fill="#dc2626" text-anchor="middle" dominant-baseline="central">帅</text>
  
  <!-- Chữ CỜ ÚP dịch xuống thêm -->
  <text x="256" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="44" font-weight="900" fill="#7f1d1d" letter-spacing="3" text-anchor="middle" dominant-baseline="central">CỜ ÚP</text>
</svg>

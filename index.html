<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cờ Tướng Úp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1c1917;
      color: #fef3c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wood-frame {
      background: linear-gradient(145deg, #d97706, #92400e);
      padding: 6px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.3);
      border: 2px solid #78350f;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      border-radius: 8px;
      touch-action: none;
    }
    .lvl-btn {
      transition: all 0.15s ease;
      border: 2px solid #57534e;
      background-color: #292524;
      color: #d6d3d1;
    }
    .lvl-btn.active {
      background-color: #f59e0b;
      color: #1c1917;
      border-color: #fef08a;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .ctrl-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-3">

  <!-- 1. Thanh chọn mức độ & Âm thanh -->
  <div id="topBar" class="w-full flex flex-col gap-1.5 shrink-0">
    <div class="grid grid-cols-9 gap-1.5 w-full">
      <button onclick="setDifficulty(1)" id="lvl-1" class="lvl-btn active col-span-2 py-2.5 sm:py-3.5 rounded-xl text-base sm:text-xl font-bold">Rất Dễ</button>
      <button onclick="setDifficulty(2)" id="lvl-2" class="lvl-btn col-span-2 py-2.5 sm:py-3.5 rounded-xl text-base sm:text-xl font-bold">Dễ</button>
      <button onclick="setDifficulty(3)" id="lvl-3" class="lvl-btn col-span-2 py-2.5 sm:py-3.5 rounded-xl text-base sm:text-xl font-bold">Vừa</button>
      <button onclick="setDifficulty(4)" id="lvl-4" class="lvl-btn col-span-2 py-2.5 sm:py-3.5 rounded-xl text-base sm:text-xl font-bold">Khó</button>
      <button onclick="toggleSound()" id="soundBtn" class="col-span-1 py-2.5 sm:py-3.5 rounded-xl bg-stone-800 border-2 border-stone-600 text-amber-300 text-lg sm:text-2xl font-bold flex items-center justify-center">🔊</button>
    </div>

    <div class="w-full bg-stone-800/95 border border-stone-700 rounded-xl px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="turnDot" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-red-500 animate-pulse inline-block"></span>
        <span id="statusText" class="text-base sm:text-2xl font-extrabold text-amber-300">Lượt bạn (Quân Đỏ)</span>
      </div>
      <span id="checkAlert" class="hidden px-2.5 py-0.5 bg-red-600 text-white font-black text-sm sm:text-xl rounded-lg animate-bounce">⚡ CHIẾU TƯỚNG!</span>
    </div>
  </div>

  <!-- 2. Bàn cờ tự động giãn tối đa màn hình -->
  <div id="boardArea" class="flex-1 w-full flex items-center justify-center my-1 overflow-hidden">
    <div class="wood-frame">
      <canvas id="chessCanvas"></canvas>
    </div>
  </div>

  <!-- 3. Cụm điều khiển dưới cùng -->
  <div id="bottomBar" class="w-full flex flex-col gap-2 shrink-0">
    <div class="grid grid-cols-2 gap-3 w-full">
      <button id="undoBtn" onclick="undoMove()" disabled class="ctrl-btn py-3 sm:py-4 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-stone-950 font-black text-lg sm:text-2xl shadow-lg border-2 border-amber-200 flex items-center justify-center gap-2">
        <span>↩️ ĐI LẠI</span>
        <span id="undoBadge" class="bg-stone-900 text-amber-300 px-2 py-0.5 rounded-md text-sm sm:text-lg">0</span>
      </button>
      <button onclick="confirmNewGame()" class="ctrl-btn py-3 sm:py-4 rounded-xl bg-red-700 hover:bg-red-600 text-white font-black text-lg sm:text-2xl shadow-lg border-2 border-red-400 flex items-center justify-center gap-2">
        <span>🔄 VÁN MỚI</span>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2 w-full bg-stone-800/90 border border-stone-700 rounded-xl p-2">
      <div class="flex flex-col">
        <div class="flex justify-between items-center text-xs sm:text-base font-bold text-red-300 mb-0.5">
          <span>BẠN ĂN:</span>
          <span id="blackHiddenCount" class="text-stone-300">Đen úp: 15</span>
        </div>
        <div id="capturedByRed" class="min-h-[28px] sm:min-h-[36px] flex flex-wrap items-center gap-1 bg-stone-900/80 rounded-lg px-2 py-1 text-lg sm:text-2xl font-black text-sky-300"></div>
      </div>
      <div class="flex flex-col">
        <div class="flex justify-between items-center text-xs sm:text-base font-bold text-sky-300 mb-0.5">
          <span>MÁY ĂN:</span>
          <span id="redHiddenCount" class="text-stone-300">Đỏ úp: 15</span>
        </div>
        <div id="capturedByBlack" class="min-h-[28px] sm:min-h-[36px] flex flex-wrap items-center gap-1 bg-stone-900/80 rounded-lg px-2 py-1 text-lg sm:text-2xl font-black text-red-400"></div>
      </div>
    </div>
  </div>

  <!-- Hộp thoại kết thúc -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
    <div class="bg-stone-800 border-4 border-amber-500 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl">
      <div id="modalIcon" class="text-6xl mb-3">🏆</div>
      <h2 id="modalTitle" class="text-2xl sm:text-3xl font-black text-amber-300 mb-2">CHIẾN THẮNG!</h2>
      <p id="modalMsg" class="text-lg sm:text-xl text-stone-200 mb-6">Chúc mừng bạn đã thắng ván cờ!</p>
      <div id="modalButtons" class="flex gap-3 justify-center"></div>
    </div>
  </div>

  <script>
    const COLS = 9;
    const ROWS = 10;

    const PIECE_INFO = {
      K: { hanRed: '帅', hanBlack: '將', value: 10000 },
      R: { hanRed: '俥', hanBlack: '車', value: 900 },
      C: { hanRed: '炮', hanBlack: '砲', value: 450 },
      N: { hanRed: '傌', hanBlack: '馬', value: 400 },
      B: { hanRed: '相', hanBlack: '象', value: 250 },
      A: { hanRed: '仕', hanBlack: '士', value: 250 },
      P: { hanRed: '兵', hanBlack: '卒', value: 150 }
    };

    const SLOT_ROLES = {
      '0,0': 'R', '0,1': 'N', '0,2': 'B', '0,3': 'A', '0,4': 'K', '0,5': 'A', '0,6': 'B', '0,7': 'N', '0,8': 'R',
      '2,1': 'C', '2,7': 'C',
      '3,0': 'P', '3,2': 'P', '3,4': 'P', '3,6': 'P', '3,8': 'P',
      '9,0': 'R', '9,1': 'N', '9,2': 'B', '9,3': 'A', '9,4': 'K', '9,5': 'A', '9,6': 'B', '9,7': 'N', '9,8': 'R',
      '7,1': 'C', '7,7': 'C',
      '6,0': 'P', '6,2': 'P', '6,4': 'P', '6,6': 'P', '6,8': 'P'
    };

    const canvas = document.getElementById('chessCanvas');
    const ctx = canvas.getContext('2d');

    let cellSize = 48;
    let margin = 32;
    let board = [];
    let turn = 'r';
    let selected = null;
    let validMoves = [];
    let historyStack = [];
    let capturedByRed = [];
    let capturedByBlack = [];
    let lastMove = null;
    let difficulty = 1;
    let soundOn = true;
    let gameOver = false;
    let aiThinking = false;

    let audioCtx = null;
    function playTone(type) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'select') {
          osc.frequency.setValueAtTime(520, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'move') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.09);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'capture') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
          osc.start(now); osc.stop(now + 0.14);
        } else if (type === 'check') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.start(now); osc.stop(now + 0.28);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    }

    function setDifficulty(lvl) {
      difficulty = lvl;
      for (let i = 1; i <= 4; i++) {
        document.getElementById('lvl-' + i).classList.toggle('active', i === lvl);
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initGame() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      const pool = ['R','R','N','N','B','B','A','A','C','C','P','P','P','P','P'];
      const redPool = shuffle(pool);
      const blackPool = shuffle(pool);
      let rIdx = 0, bIdx = 0;

      for (const key in SLOT_ROLES) {
        const [r, c] = key.split(',').map(Number);
        const slotRole = SLOT_ROLES[key];
        const color = r >= 5 ? 'r' : 'b';
        if (slotRole === 'K') {
          board[r][c] = { color, trueType: 'K', slotRole: 'K', isHidden: false };
        } else {
          const trueType = color === 'r' ? redPool[rIdx++] : blackPool[bIdx++];
          board[r][c] = { color, trueType, slotRole, isHidden: true };
        }
      }

      turn = 'r';
      selected = null;
      validMoves = [];
      historyStack = [];
      capturedByRed = [];
      capturedByBlack = [];
      lastMove = null;
      gameOver = false;
      aiThinking = false;

      closeModal();
      updateUI();
      resizeBoard();
    }

    function resizeBoard() {
      const boardArea = document.getElementById('boardArea');
      const availW = boardArea.clientWidth - 16;
      const availH = boardArea.clientHeight - 16;

      const cellByW = availW / 9.25;
      const cellByH = availH / 10.25;
      cellSize = Math.max(30, Math.floor(Math.min(cellByW, cellByH)));
      margin = Math.round(cellSize * 0.62);

      const cssW = Math.round(COLS > 1 ? (COLS - 1) * cellSize + margin * 2 : 300);
      const cssH = Math.round(ROWS > 1 ? (ROWS - 1) * cellSize + margin * 2 : 340);

      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const syncWidth = (cssW + 14) + 'px';
      document.getElementById('topBar').style.maxWidth = syncWidth;
      document.getElementById('bottomBar').style.maxWidth = syncWidth;

      drawBoard();
    }

    window.addEventListener('resize', resizeBoard);

    function getActiveRole(piece) {
      return piece.isHidden ? piece.slotRole : piece.trueType;
    }

    function inBounds(r, c) {
      return r >= 0 && r < ROWS && c >= 0 && c < COLS;
    }

    function inPalace(color, r, c) {
      if (c < 3 || c > 5) return false;
      return color === 'r' ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
    }

    function getPseudoMoves(bd, r, c) {
      const p = bd[r][c];
      if (!p) return [];
      const role = getActiveRole(p);
      const color = p.color;
      const moves = [];

      const addMove = (nr, nc) => {
        if (!inBounds(nr, nc)) return false;
        const target = bd[nr][nc];
        if (!target) {
          moves.push({ r: nr, c: nc });
          return true;
        }
        if (target.color !== color) {
          moves.push({ r: nr, c: nc });
        }
        return false;
      };

      if (role === 'K') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr, dc] of dirs) {
          const nr = r + dr, nc = c + dc;
          if (inPalace(color, nr, nc)) addMove(nr, nc);
        }
      } else if (role === 'A') {
        const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (const [dr, dc] of dirs) {
          const nr = r + dr, nc = c + dc;
          if (p.isHidden) {
            if (inPalace(color, nr, nc)) addMove(nr, nc);
          } else {
            addMove(nr, nc);
          }
        }
      } else if (role === 'B') {
        const dirs = [[-2,-2],[-2,2],[2,-2],[2,2]];
        for (const [dr, dc] of dirs) {
          const nr = r + dr, nc = c + dc;
          const er = r + dr / 2, ec = c + dc / 2;
          if (inBounds(nr, nc) && !bd[er][ec]) {
            addMove(nr, nc);
          }
        }
      } else if (role === 'N') {
        const jumps = [
          [-2,-1,-1,0], [-2,1,-1,0],
          [2,-1,1,0],   [2,1,1,0],
          [-1,-2,0,-1], [1,-2,0,-1],
          [-1,2,0,1],   [1,2,0,1]
        ];
        for (const [dr, dc, lr, lc] of jumps) {
          const nr = r + dr, nc = c + dc;
          const br = r + lr, bc = c + lc;
          if (inBounds(nr, nc) && !bd[br][bc]) {
            addMove(nr, nc);
          }
        }
      } else if (role === 'R') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr, dc] of dirs) {
          let nr = r + dr, nc = c + dc;
          while (inBounds(nr, nc)) {
            if (!bd[nr][nc]) {
              moves.push({ r: nr, c: nc });
            } else {
              if (bd[nr][nc].color !== color) moves.push({ r: nr, c: nc });
              break;
            }
            nr += dr; nc += dc;
          }
        }
      } else if (role === 'C') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr, dc] of dirs) {
          let nr = r + dr, nc = c + dc;
          let jumped = false;
          while (inBounds(nr, nc)) {
            if (!jumped) {
              if (!bd[nr][nc]) {
                moves.push({ r: nr, c: nc });
              } else {
                jumped = true;
              }
            } else {
              if (bd[nr][nc]) {
                if (bd[nr][nc].color !== color) moves.push({ r: nr, c: nc });
                break;
              }
            }
            nr += dr; nc += dc;
          }
        }
      } else if (role === 'P') {
        const forward = color === 'r' ? -1 : 1;
        addMove(r + forward, c);
        const crossedRiver = color === 'r' ? r <= 4 : r >= 5;
        if (crossedRiver) {
          addMove(r, c - 1);
          addMove(r, c + 1);
        }
      }

      return moves;
    }

    function cloneBoard(bd) {
      return bd.map(row => row.map(cell => cell ? { ...cell } : null));
    }

    function findKing(bd, color) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = bd[r][c];
          if (p && p.color === color && !p.isHidden && p.trueType === 'K') {
            return { r, c };
          }
        }
      }
      return null;
    }

    function kingsFacing(bd) {
      const rk = findKing(bd, 'r');
      const bk = findKing(bd, 'b');
      if (!rk || !bk || rk.c !== bk.c) return false;
      for (let r = bk.r + 1; r < rk.r; r++) {
        if (bd[r][rk.c]) return false;
      }
      return true;
    }

    function isKingInCheck(bd, color) {
      if (kingsFacing(bd)) return true;
      const king = findKing(bd, color);
      if (!king) return true;
      const enemy = color === 'r' ? 'b' : 'r';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = bd[r][c];
          if (p && p.color === enemy) {
            const mvs = getPseudoMoves(bd, r, c);
            if (mvs.some(m => m.r === king.r && m.c === king.c)) return true;
          }
        }
      }
      return false;
    }

    function getLegalMoves(bd, r, c) {
      const p = bd[r][c];
      if (!p) return [];
      const pseudo = getPseudoMoves(bd, r, c);
      const legal = [];
      for (const m of pseudo) {
        const nextBd = cloneBoard(bd);
        const moving = nextBd[r][c];
        nextBd[m.r][m.c] = moving;
        nextBd[r][c] = null;
        if (moving.isHidden) moving.isHidden = false;
        if (!isKingInCheck(nextBd, p.color)) {
          legal.push(m);
        }
      }
      return legal;
    }

    function getAllLegalMoves(bd, color) {
      const all = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = bd[r][c];
          if (p && p.color === color) {
            const mvs = getLegalMoves(bd, r, c);
            for (const m of mvs) {
              all.push({ fromR: r, fromC: c, toR: m.r, toC: m.c });
            }
          }
        }
      }
      return all;
    }

    function makeMove(fromR, fromC, toR, toC) {
      if (turn === 'r') {
        historyStack.push({
          board: cloneBoard(board),
          capturedByRed: [...capturedByRed],
          capturedByBlack: [...capturedByBlack],
          lastMove: lastMove ? { ...lastMove } : null
        });
      }

      const moving = board[fromR][fromC];
      const target = board[toR][toC];

      if (target) {
        const revealedTarget = { ...target, isHidden: false };
        if (moving.color === 'r') capturedByRed.push(revealedTarget);
        else capturedByBlack.push(revealedTarget);
      }

      board[toR][toC] = moving;
      board[fromR][fromC] = null;
      if (moving.isHidden) moving.isHidden = false;

      lastMove = { fromR, fromC, toR, toC };
      selected = null;
      validMoves = [];

      const nextTurn = turn === 'r' ? 'b' : 'r';
      turn = nextTurn;

      const inCheck = isKingInCheck(board, turn);
      if (inCheck) playTone('check');
      else if (target) playTone('capture');
      else playTone('move');

      updateUI();
      drawBoard();

      const remainingMoves = getAllLegalMoves(board, turn);
      if (remainingMoves.length === 0) {
        gameOver = true;
        if (turn === 'b') {
          showEndModal('🏆', 'BẠN ĐÃ CHIẾN THẮNG!', 'Tuyệt vời! Bạn đã chiếu bí quân Đen.');
        } else {
          showEndModal('😊', 'VÁN CỜ KẾT THÚC', 'Quân Đen đã thắng ván này. Mời bạn bấm ĐI LẠI hoặc VÁN MỚI!');
        }
        return;
      }

      if (turn === 'b' && !gameOver) {
        aiThinking = true;
        updateUI();
        setTimeout(makeAIMove, 400);
      }
    }

    function evaluateBoard(bd) {
      let score = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = bd[r][c];
          if (!p) continue;
          const val = p.isHidden ? 320 : PIECE_INFO[p.trueType].value;
          score += p.color === 'b' ? val : -val;
        }
      }
      return score;
    }

    function makeAIMove() {
      if (gameOver || turn !== 'b') return;
      const moves = getAllLegalMoves(board, 'b');
      if (moves.length === 0) return;

      let chosen = moves[0];

      if (difficulty === 1) {
        const nonCaptureKing = moves.filter(m => {
          const t = board[m.toR][m.toC];
          return !t || (t.trueType !== 'R' && t.trueType !== 'C');
        });
        const pool = nonCaptureKing.length > 0 && Math.random() < 0.75 ? nonCaptureKing : moves;
        chosen = pool[Math.floor(Math.random() * pool.length)];
      } else if (difficulty === 2) {
        let bestScore = -Infinity;
        for (const m of shuffle(moves)) {
          const target = board[m.toR][m.toC];
          let sc = target ? (target.isHidden ? 300 : PIECE_INFO[target.trueType].value) : 0;
          sc += Math.random() * 140;
          if (sc > bestScore) { bestScore = sc; chosen = m; }
        }
      } else {
        const depth = difficulty === 3 ? 2 : 3;
        let bestVal = -Infinity;
        for (const m of shuffle(moves)) {
          const nextBd = cloneBoard(board);
          const mvP = nextBd[m.fromR][m.fromC];
          nextBd[m.toR][m.toC] = mvP;
          nextBd[m.fromR][m.fromC] = null;
          if (mvP.isHidden) mvP.isHidden = false;
          const val = minimax(nextBd, depth - 1, -Infinity, Infinity, false);
          if (val > bestVal) {
            bestVal = val;
            chosen = m;
          }
        }
      }

      aiThinking = false;
      makeMove(chosen.fromR, chosen.fromC, chosen.toR, chosen.toC);
    }

    function minimax(bd, depth, alpha, beta, isMax) {
      if (depth === 0) return evaluateBoard(bd);
      const color = isMax ? 'b' : 'r';
      const moves = getAllLegalMoves(bd, color);
      if (moves.length === 0) return isMax ? -99999 : 99999;

      if (isMax) {
        let maxEval = -Infinity;
        for (const m of moves) {
          const nextBd = cloneBoard(bd);
          const mvP = nextBd[m.fromR][m.fromC];
          nextBd[m.toR][m.toC] = mvP;
          nextBd[m.fromR][m.fromC] = null;
          if (mvP.isHidden) mvP.isHidden = false;
          const ev = minimax(nextBd, depth - 1, alpha, beta, false);
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          const nextBd = cloneBoard(bd);
          const mvP = nextBd[m.fromR][m.fromC];
          nextBd[m.toR][m.toC] = mvP;
          nextBd[m.fromR][m.fromC] = null;
          if (mvP.isHidden) mvP.isHidden = false;
          const ev = minimax(nextBd, depth - 1, alpha, beta, true);
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function undoMove() {
      if (historyStack.length === 0 || aiThinking) return;
      const prev = historyStack.pop();
      board = prev.board;
      capturedByRed = prev.capturedByRed;
      capturedByBlack = prev.capturedByBlack;
      lastMove = prev.lastMove;
      turn = 'r';
      selected = null;
      validMoves = [];
      gameOver = false;
      closeModal();
      playTone('select');
      updateUI();
      drawBoard();
    }

    function updateUI() {
      const statusText = document.getElementById('statusText');
      const turnDot = document.getElementById('turnDot');
      const checkAlert = document.getElementById('checkAlert');

      if (turn === 'r') {
        statusText.textContent = 'Lượt bạn (Quân Đỏ)';
        statusText.className = 'text-base sm:text-2xl font-extrabold text-amber-300';
        turnDot.className = 'w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-red-500 animate-pulse inline-block';
      } else {
        statusText.textContent = 'Máy đang suy nghĩ...';
        statusText.className = 'text-base sm:text-2xl font-extrabold text-sky-300';
        turnDot.className = 'w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-sky-400 animate-ping inline-block';
      }

      const inCheck = isKingInCheck(board, turn);
      checkAlert.classList.toggle('hidden', !inCheck);

      document.getElementById('undoBtn').disabled = historyStack.length === 0 || aiThinking;
      document.getElementById('undoBadge').textContent = historyStack.length;

      let redHidden = 0, blackHidden = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = board[r][c];
          if (p && p.isHidden) {
            if (p.color === 'r') redHidden++;
            else blackHidden++;
          }
        }
      }
      document.getElementById('redHiddenCount').textContent = 'Đỏ úp: ' + redHidden;
      document.getElementById('blackHiddenCount').textContent = 'Đen úp: ' + blackHidden;

      document.getElementById('capturedByRed').innerHTML = capturedByRed
        .map(p => `<span>${PIECE_INFO[p.trueType].hanBlack}</span>`).join('');
      document.getElementById('capturedByBlack').innerHTML = capturedByBlack
        .map(p => `<span>${PIECE_INFO[p.trueType].hanRed}</span>`).join('');
    }

    function drawCornerMark(cx, cy, c) {
      const gap = Math.max(3, cellSize * 0.08);
      const len = Math.max(7, cellSize * 0.2);
      ctx.strokeStyle = '#5c2804';
      ctx.lineWidth = Math.max(1.8, cellSize * 0.04);

      const drawSide = (dx, dy) => {
        ctx.beginPath();
        ctx.moveTo(cx + dx * gap, cy + dy * (gap + len));
        ctx.lineTo(cx + dx * gap, cy + dy * gap);
        ctx.lineTo(cx + dx * (gap + len), cy + dy * gap);
        ctx.stroke();
      };
      if (c > 0) { drawSide(-1, -1); drawSide(-1, 1); }
      if (c < 8) { drawSide(1, -1); drawSide(1, 1); }
    }

    function drawBoard() {
      const width = (COLS - 1) * cellSize + margin * 2;
      const height = (ROWS - 1) * cellSize + margin * 2;

      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#f6d592');
      bgGrad.addColorStop(0.5, '#eab869');
      bgGrad.addColorStop(1, '#dead58');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      const lineW = Math.max(2, cellSize * 0.045);
      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = lineW * 1.6;
      ctx.strokeRect(margin - 6, margin - 6, (COLS - 1) * cellSize + 12, (ROWS - 1) * cellSize + 12);

      ctx.lineWidth = lineW;
      for (let r = 0; r < ROWS; r++) {
        const y = margin + r * cellSize;
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(margin + (COLS - 1) * cellSize, y);
        ctx.stroke();
      }

      for (let c = 0; c < COLS; c++) {
        const x = margin + c * cellSize;
        if (c === 0 || c === COLS - 1) {
          ctx.beginPath();
          ctx.moveTo(x, margin);
          ctx.lineTo(x, margin + (ROWS - 1) * cellSize);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(x, margin);
          ctx.lineTo(x, margin + 4 * cellSize);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(x, margin + 5 * cellSize);
          ctx.lineTo(x, margin + 9 * cellSize);
          ctx.stroke();
        }
      }

      ctx.beginPath();
      ctx.moveTo(margin + 3 * cellSize, margin);
      ctx.lineTo(margin + 5 * cellSize, margin + 2 * cellSize);
      ctx.moveTo(margin + 5 * cellSize, margin);
      ctx.lineTo(margin + 3 * cellSize, margin + 2 * cellSize);
      ctx.moveTo(margin + 3 * cellSize, margin + 7 * cellSize);
      ctx.lineTo(margin + 5 * cellSize, margin + 9 * cellSize);
      ctx.moveTo(margin + 5 * cellSize, margin + 7 * cellSize);
      ctx.lineTo(margin + 3 * cellSize, margin + 9 * cellSize);
      ctx.stroke();

      const markCoords = [
        [2,1],[2,7],[7,1],[7,7],
        [3,0],[3,2],[3,4],[3,6],[3,8],
        [6,0],[6,2],[6,4],[6,6],[6,8]
      ];
      for (const [mr, mc] of markCoords) {
        drawCornerMark(margin + mc * cellSize, margin + mr * cellSize, mc);
      }

      ctx.save();
      ctx.fillStyle = '#5c2804';
      ctx.font = `900 ${Math.round(cellSize * 0.48)}px "KaiTi", "STKaiti", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const riverY = margin + 4.5 * cellSize;
      ctx.fillText('楚 河', margin + 2 * cellSize, riverY);
      ctx.fillText('漢 界', margin + 6 * cellSize, riverY);
      ctx.restore();

      if (lastMove) {
        const fx = margin + lastMove.fromC * cellSize;
        const fy = margin + lastMove.fromR * cellSize;
        const tx = margin + lastMove.toC * cellSize;
        const ty = margin + lastMove.toR * cellSize;

        ctx.save();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = Math.max(3, cellSize * 0.07);
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(fx, fy, cellSize * 0.24, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = Math.max(4, cellSize * 0.09);
        ctx.beginPath();
        ctx.arc(tx, ty, cellSize * 0.48, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = board[r][c];
          if (p) drawPiece(r, c, p);
        }
      }

      for (const m of validMoves) {
        const mx = margin + m.c * cellSize;
        const my = margin + m.r * cellSize;
        const hasTarget = board[m.r][m.c] !== null;

        ctx.save();
        if (hasTarget) {
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = Math.max(4, cellSize * 0.09);
          ctx.beginPath();
          ctx.arc(mx, my, cellSize * 0.47, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(22, 163, 74, 0.85)';
          ctx.beginPath();
          ctx.arc(mx, my, cellSize * 0.19, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawPiece(r, c, piece) {
      const x = margin + c * cellSize;
      const y = margin + r * cellSize;
      const radius = cellSize * 0.455;
      const isSelected = selected && selected.r === r && selected.c === c;

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = isSelected ? 14 : 6;
      ctx.shadowOffsetY = isSelected ? 6 : 3;

      if (piece.isHidden) {
        const grad = ctx.createRadialGradient(
          x - radius * 0.28, y - radius * 0.28, radius * 0.08,
          x, y, radius
        );
        if (piece.color === 'r') {
          grad.addColorStop(0, '#ea580c');
          grad.addColorStop(0.55, '#b45309');
          grad.addColorStop(1, '#7c2d12');
          ctx.fillStyle = grad;
          ctx.strokeStyle = '#fde68a';
        } else {
          grad.addColorStop(0, '#64748b');
          grad.addColorStop(0.6, '#334155');
          grad.addColorStop(1, '#0f172a');
          ctx.fillStyle = grad;
          ctx.strokeStyle = '#cbd5e1';
        }

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = Math.max(2.5, cellSize * 0.055);
        ctx.stroke();
      } else {
        const grad = ctx.createRadialGradient(
          x - radius * 0.25, y - radius * 0.25, radius * 0.1,
          x, y, radius
        );
        grad.addColorStop(0, '#fffef8');
        grad.addColorStop(0.75, '#fef3c7');
        grad.addColorStop(1, '#d97706');

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.lineWidth = Math.max(2.5, cellSize * 0.055);
        ctx.strokeStyle = piece.color === 'r' ? '#b91c1c' : '#1e293b';
        ctx.stroke();

        ctx.shadowColor = 'transparent';
        const info = PIECE_INFO[piece.trueType];
        const hanChar = piece.color === 'r' ? info.hanRed : info.hanBlack;
        ctx.fillStyle = piece.color === 'r' ? '#dc2626' : '#0f172a';
        const fontSize = Math.round(radius * 1.38);
        ctx.font = `900 ${fontSize}px "KaiTi", "STKaiti", "PMingLiU", "Noto Serif SC", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(hanChar, x, y + radius * 0.04);
      }

      if (isSelected) {
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = Math.max(4, cellSize * 0.09);
        ctx.beginPath();
        ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (gameOver || aiThinking || turn !== 'r') return;
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;

      const c = Math.round((px - margin) / cellSize);
      const r = Math.round((py - margin) / cellSize);
      if (!inBounds(r, c)) return;

      const moveTarget = validMoves.find(m => m.r === r && m.c === c);
      if (selected && moveTarget) {
        makeMove(selected.r, selected.c, r, c);
        return;
      }

      const clicked = board[r][c];
      if (clicked && clicked.color === 'r') {
        selected = { r, c };
        validMoves = getLegalMoves(board, r, c);
        playTone('select');
        drawBoard();
      } else {
        selected = null;
        validMoves = [];
        drawBoard();
      }
    });

    function showEndModal(icon, title, msg) {
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMsg').textContent = msg;
      document.getElementById('modalButtons').innerHTML = `
        <button onclick="undoMove()" class="px-5 py-3 rounded-xl bg-amber-500 text-stone-950 font-black text-xl">↩️ Đi lại</button>
        <button onclick="initGame()" class="px-5 py-3 rounded-xl bg-red-600 text-white font-black text-xl">🔄 Ván mới</button>
      `;
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function confirmNewGame() {
      if (historyStack.length === 0 || gameOver) {
        initGame();
        return;
      }
      document.getElementById('modalIcon').textContent = '🔄';
      document.getElementById('modalTitle').textContent = 'CHƠI VÁN MỚI?';
      document.getElementById('modalMsg').textContent = 'Bạn có muốn xếp lại bàn cờ để bắt đầu ván mới không?';
      document.getElementById('modalButtons').innerHTML = `
        <button onclick="closeModal()" class="px-6 py-3 rounded-xl bg-stone-600 text-white font-bold text-xl">Không</button>
        <button onclick="initGame()" class="px-6 py-3 rounded-xl bg-red-600 text-white font-black text-xl">Có, chơi mới</button>
      `;
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    initGame();
  </script>
</body>
